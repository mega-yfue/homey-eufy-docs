# Build the Anker Eufy for Homey help site and publish it at https://mega-yfue.github.io/homey-eufy-docs/
#
# This repo holds NO documentation content — only this workflow. The site is generated entirely from
# the app repo's `site/` folder on every run, so there is nothing here to keep in sync and no copy of
# the pages to drift out of date. Edit the pages in the app repo.
#
# The app repo is PRIVATE, so this repo's own GITHUB_TOKEN cannot check it out. The checkout uses a
# fine-grained personal access token instead, stored here as the `HOMEY_APP_READ_TOKEN` secret:
#
#   1. GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens →
#      Generate new token. Resource owner: mega-yfue. Repository access: Only select repositories →
#      homey-eufy-app. Permissions: Contents → Read-only (Metadata → Read-only is added with it).
#      Nothing else.
#   2. If the organization requires approval for fine-grained tokens, approve it under
#      Organization → Settings → Personal access tokens → Pending requests.
#   3. This repo → Settings → Secrets and variables → Actions → New repository secret
#      `HOMEY_APP_READ_TOKEN`: paste the token.
#
# The token reaches that one repo only and can only read it. It expires on the date picked when it
# was made; the nightly build fails on the day it does, and a new token in the same secret fixes it.
#
# What gets published: the app repo's `site/` VitePress build. `site/migration.md` includes
# `../docs/migration.md`, which is why the whole app repo is checked out rather than `site/` alone.
# Nothing else from the private repo is copied into the published output.
#
# The site base is `/homey-eufy-docs/`: GitHub Pages serves a project repo under `/<repo>/`, and the
# site's VitePress config reads `SITE_BASE` for anything other than its default.
#
# ── Why there is no `pull_request` trigger ──────────────────────────────────────────────────────
# Every page comes from another repository, so a pull request here has no content to validate — and
# the job carries `pages: write`, which publishes the live site. The app repo's own `site` workflow
# builds the site on its pull requests.
#
# ── Actions are pinned to full-length commit SHAs ───────────────────────────────────────────────
# A tag is mutable; a SHA is not, so an update is a reviewable diff. The trailing `# vX.Y.Z` is the
# human-readable version, which Dependabot rewrites alongside the SHA (see dependabot.yml).
name: pages

on:
  push:
    branches: [main]
  # The app repo cannot notify this one without a cross-repo token, so the site refreshes nightly
  # and on demand. Use "Run workflow" for an immediate publish after a docs change.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# Least privilege plus the tokens the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; never cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the app repo (source of the site)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mega-yfue/homey-eufy-app
          ref: main
          token: ${{ secrets.HOMEY_APP_READ_TOKEN }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build the site
        working-directory: site
        env:
          SITE_BASE: /homey-eufy-docs/
        run: npm run build

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
